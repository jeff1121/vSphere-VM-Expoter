name: CodeQL 安全掃描

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # 每週一 UTC 02:00 執行排程掃描
    - cron: "0 2 * * 1"

jobs:
  analyze-csharp:
    name: 分析 C#（後端）
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 安裝 .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: 初始化 CodeQL（C#）
        uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: 建置後端供 CodeQL 分析
        run: dotnet build backend/src/Backend.csproj --configuration Release

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"

  analyze-javascript:
    name: 分析 JavaScript（前端）
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 初始化 CodeQL（JavaScript）
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-and-quality

      - name: 執行 CodeQL 自動建置
        uses: github/codeql-action/autobuild@v3

      - name: 執行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
